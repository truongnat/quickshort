name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "version to build (e.g. 0.2.0)"
        required: false

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    env:
      SIGNING_P12_B64: ${{ secrets.QS_SIGN_P12 }}
      SIGNING_P12_PASSWORD: ${{ secrets.QS_SIGN_P12_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      # self-signed codesigning identity — keeps a stable TCC identity across
      # updates. Skips silently when the secrets aren't configured (adhoc).
      - name: import signing certificate
        run: |
          if [ -n "$SIGNING_P12_B64" ]; then
            KEYCHAIN=qs-signing.keychain-db
            security create-keychain -p "" "$KEYCHAIN"
            security set-keychain-settings -t 3600 -l -u "$KEYCHAIN"
            security unlock-keychain -p "" "$KEYCHAIN"
            echo "$SIGNING_P12_B64" | base64 -d > /tmp/qs-signing.p12
            security import /tmp/qs-signing.p12 -k "$KEYCHAIN" \
              -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
            # grant codesign the key partition — without this it pops a
            # SecurityAgent dialog and hangs the headless runner
            security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -k "" "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
            rm /tmp/qs-signing.p12
            echo "SIGNING_IDENTITY=quickshort" >> "$GITHUB_ENV"
          else
            echo "SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi

      - name: build + package
        env:
          QS_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          VER="${QS_VERSION#v}"
          case "$VER" in master|main) VER="" ;; esac
          packaging/macos/release.sh $VER

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: build
        run: cargo build --release -p qs-app

      - name: nsis installer
        shell: bash
        run: |
          command -v makensis >/dev/null || choco install nsis -y --no-progress
          export PATH="$PATH:/c/Program Files (x86)/NSIS:/c/Program Files/NSIS"
          VER="${{ github.event.inputs.version || github.ref_name }}"
          VER="${VER#v}"
          case "$VER" in
            master|main) VER=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/qs-app/Cargo.toml | head -1) ;;
          esac
          mkdir -p dist
          makensis "/DVERSION=$VER" "/DBIN=target\\release\\quickshort.exe" \
            "/DOUT=dist\\Quickshort-Windows-Setup.exe" \
            packaging/windows/installer.nsi
          cd dist && sha256sum Quickshort-Windows-Setup.exe \
            > Quickshort-Windows-Setup.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: dist/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libayatana-appindicator3-dev \
            libpipewire-0.3-dev libclang-dev pkg-config

      - name: build + package
        env:
          QS_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          VER="${QS_VERSION#v}"
          case "$VER" in master|main) VER="" ;; esac
          packaging/linux/package.sh $VER

      - name: checksums
        run: |
          cd dist
          sha256sum Quickshort-Linux.AppImage quickshort_amd64.deb \
            > linux.sha256 2>/dev/null || sha256sum quickshort_amd64.deb > linux.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [macos, windows, linux]
    env:
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: publish github release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          TAG="${VER#v}"
          case "$TAG" in
            master|main)
              echo "no version — push a v* tag or pass workflow_dispatch version"
              exit 1 ;;
          esac
          gh release create "v$TAG" artifacts/* \
            --title "Quickshort v$TAG" --generate-notes

      # optional: bump the homebrew-tap cask (needs TAP_TOKEN secret and a
      # truongnat/homebrew-tap repo containing Casks/quickshort.rb)
      - name: bump homebrew cask
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          [ -n "$TAP_TOKEN" ] || { echo "no TAP_TOKEN — skipping tap bump"; exit 0; }
          VER="$(ls artifacts | sed -n 's/Quickshort-v\(.*\)-macos.zip/\1/p' | head -1)"
          SHA="$(cut -d' ' -f1 artifacts/Quickshort-v$VER-macos.zip.sha256)"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/truongnat/homebrew-tap" /tmp/tap
          cd /tmp/tap
          sed -i "s/version \".*\"/version \"$VER\"/; s/sha256 \".*\"/sha256 \"$SHA\"/" \
            Casks/quickshort.rb
          git -c user.name=devin -c user.email=devin@localhost commit \
            -am "quickshort $VER" || exit 0
          git push
