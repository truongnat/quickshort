name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "version to build (e.g. 0.2.0)"
        required: false

permissions:
  contents: write

jobs:
  # the release must exist before either platform job can upload assets
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ github.event.inputs.version || github.ref_name }}
        run: gh release create "v${VER#v}" --title "Quickshort v${VER#v}" --generate-notes -R truongnat/quickshort

  macos:
    needs: create-release
    runs-on: macos-latest
    env:
      SIGNING_P12_B64: ${{ secrets.QS_SIGN_P12 }}
      SIGNING_P12_PASSWORD: ${{ secrets.QS_SIGN_P12_PASSWORD }}
      TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      # self-signed codesigning identity — keeps a stable TCC identity across
      # updates. Skips silently when the secrets aren't configured (adhoc).
      - name: import signing certificate
        run: |
          if [ -n "$SIGNING_P12_B64" ]; then
            KEYCHAIN=qs-signing.keychain-db
            security create-keychain -p "" "$KEYCHAIN"
            security set-keychain-settings -t 3600 -l -u "$KEYCHAIN"
            security unlock-keychain -p "" "$KEYCHAIN"
            echo "$SIGNING_P12_B64" | base64 -d > /tmp/qs-signing.p12
            security import /tmp/qs-signing.p12 -k "$KEYCHAIN" \
              -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
            # grant codesign the key partition — without this it pops a
            # SecurityAgent dialog and hangs the headless runner
            security set-key-partition-list -S apple-tool:,apple:,codesign: \
              -k "" "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
            rm /tmp/qs-signing.p12
            echo "SIGNING_IDENTITY=quickshort" >> "$GITHUB_ENV"
          else
            echo "SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi

      - name: build + package
        run: packaging/macos/release.sh

      - name: publish github release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          gh release upload "v${VER#v}" --clobber \
            dist/Quickshort-v*-macos.zip \
            dist/Quickshort-v*-macos.zip.sha256 \
            dist/Quickshort-v*-macos.dmg \
            dist/Quickshort-v*-macos.dmg.sha256

      # optional: bump the homebrew-tap cask (needs TAP_TOKEN secret and a
      # truongnat/homebrew-tap repo containing Casks/quickshort.rb)
      - name: bump homebrew cask
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          [ -n "$TAP_TOKEN" ] || { echo "no TAP_TOKEN — skipping tap bump"; exit 0; }
          VER="$(ls dist | sed -n 's/Quickshort-v\(.*\)-macos.zip/\1/p' | head -1)"
          SHA="$(cut -d' ' -f1 dist/Quickshort-v$VER-macos.zip.sha256)"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/truongnat/homebrew-tap" /tmp/tap
          cd /tmp/tap
          sed -i '' "s/version \".*\"/version \"$VER\"/; s/sha256 \".*\"/sha256 \"$SHA\"/" \
            Casks/quickshort.rb
          git -c user.name=devin -c user.email=devin@localhost commit \
            -am "quickshort $VER" || exit 0
          git push

  # windows: compile-checked backend — ships a bare exe as an experimental
  # artifact until it gets real QA (no installer, no signing)
  windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: build
        run: cargo build --release -p qs-app
      - name: package + upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ github.event.inputs.version || github.ref_name }}
        shell: bash
        run: |
          TAG="${VER#v}"
          mkdir -p dist
          cp target/release/quickshort.exe "dist/Quickshort-v$TAG-windows.exe"
          (cd dist && sha256sum "Quickshort-v$TAG-windows.exe" > "Quickshort-v$TAG-windows.exe.sha256")
          gh release upload "v$TAG" --clobber \
            "dist/Quickshort-v$TAG-windows.exe" \
            "dist/Quickshort-v$TAG-windows.exe.sha256"
