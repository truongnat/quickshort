# Push-time compile + test verification — release.yml builds artifacts on
# tags only, so Linux/Windows breakage on regular commits needs its own
# gate. Runs the same system deps as the release linux job.
name: verify

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libayatana-appindicator3-dev \
            libpipewire-0.3-dev libclang-dev pkg-config
      - name: check + test
        run: |
          cargo check --workspace
          cargo test --workspace

  # Headless on-device verify for the album chrome: a real X server
  # (Xvfb, depth-32 ARGB + XShape) hosts the `--chrome` demo and the
  # root window is screenshotted — the artifact is the visual proof
  # that the X11 backend renders the fan.
  linux-x11-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libayatana-appindicator3-dev \
            libpipewire-0.3-dev libclang-dev pkg-config \
            xvfb x11-apps imagemagick fonts-dejavu-core
      - name: build
        run: cargo build -p qs-app
      - name: run the album demo under Xvfb
        run: |
          xvfb-run -a -s "-screen 0 1024x768x24" bash -c '
            ./target/debug/quickshort --chrome &
            APP=$!
            sleep 6
            import -window root /tmp/chrome-x11.png
            kill $APP 2>/dev/null || true
          '
          identify /tmp/chrome-x11.png
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-x11-smoke
          path: /tmp/chrome-x11.png
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace
