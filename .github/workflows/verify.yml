# Push-time compile + test verification — release.yml builds artifacts on
# tags only, so Linux/Windows breakage on regular commits needs its own
# gate. Runs the same system deps as the release linux job.
name: verify

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libayatana-appindicator3-dev \
            libpipewire-0.3-dev libclang-dev pkg-config
      - name: check + test
        run: |
          cargo check --workspace
          cargo test --workspace

  # Headless on-device verify for the album chrome: a real X server
  # (Xvfb, depth-32 ARGB + XShape) hosts the `--chrome` demo and the
  # root window is screenshotted — the artifact is the visual proof
  # that the X11 backend renders the fan.
  linux-x11-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libayatana-appindicator3-dev \
            libpipewire-0.3-dev libclang-dev pkg-config \
            xvfb x11-apps x11-utils xdotool imagemagick fonts-dejavu-core libxkbcommon-x11-0
      - name: build
        run: cargo build -p qs-app
      - name: run the album demo under Xvfb
        run: |
          xvfb-run -a -s "-screen 0 1024x768x24" bash -c '
            xdpyinfo | grep -iE "depths|XShape|COMPOSITE" > /tmp/chrome-app.log
            ./target/debug/quickshort --chrome >> /tmp/chrome-app.log 2>&1 &
            APP=$!
            sleep 4
            # hover the edge sliver to re-open the fan, then shoot
            xdotool mousemove 795 90 mousemove 790 90 sleep 1.5
            xwininfo -root -tree >> /tmp/chrome-app.log
            import -window root /tmp/chrome-x11.png
            kill $APP 2>/dev/null || true
          '
          cat /tmp/chrome-app.log
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-x11-smoke
          path: |
            /tmp/chrome-x11.png
            /tmp/chrome-app.log
          if-no-files-found: error

  # Same idea on the compositor side: headless Weston hosts the demo,
  # weston-screenshooter grabs the output — proves the wl_shm layer.
  linux-wayland-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libayatana-appindicator3-dev \
            libpipewire-0.3-dev libclang-dev pkg-config \
            weston imagemagick fonts-dejavu-core gdb
      - name: build
        run: cargo build -p qs-app
      - name: run the album demo under Weston
        run: |
          export XDG_RUNTIME_DIR=/tmp/xdg
          mkdir -p "$XDG_RUNTIME_DIR" && chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket=wl-test --width=1024 --height=768 --idle-time=0 > /tmp/weston.log 2>&1 &
          WESTON=$!
          sleep 3
          ls -la "$XDG_RUNTIME_DIR" >> /tmp/chrome-wl.log 2>&1
          ( cd /tmp && WAYLAND_DISPLAY=wl-test XDG_SESSION_TYPE=wayland \
            gdb -batch -ex run -ex bt --args \
            "$GITHUB_WORKSPACE/target/debug/quickshort" --chrome > /tmp/chrome-wl.log 2>&1 ) &
          APP=$!
          # shots land at 0/1/2s; capture at ~3s while the fan is open
          sleep 3
          ( cd /tmp && weston-screenshooter -S wl-test 2>> /tmp/chrome-wl.log || true )
          sleep 1
          mv /tmp/wayland-screenshot*.png /tmp/chrome-wl.png || true
          identify /tmp/chrome-wl.png || true
          cat /tmp/chrome-wl.log
          echo "--- weston ---"
          cat /tmp/weston.log
          kill $APP $WESTON 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-wayland-smoke
          path: |
            /tmp/chrome-wl.png
            /tmp/chrome-wl.log
            /tmp/weston.log
          if-no-files-found: warn
      - name: dump logs on failure
        if: failure()
        run: cat /tmp/chrome-wl.log /tmp/weston.log 2>/dev/null | tail -60

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace
