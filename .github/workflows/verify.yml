# Push-time compile + test verification — release.yml builds artifacts on
# tags only, so Linux/Windows breakage on regular commits needs its own
# gate. Runs the same system deps as the release linux job.
name: verify

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libayatana-appindicator3-dev \
            libpipewire-0.3-dev libclang-dev pkg-config
      - name: check + test
        run: |
          cargo check --workspace
          cargo test --workspace

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace
