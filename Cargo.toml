[workspace]
resolver = "2"
members = ["crates/qs-app", "crates/qs-capture", "crates/qs-core", "crates/qs-ocr", "crates/qs-overlay"]

[workspace.dependencies]
anyhow = "1"
image = "0.25"
qs-core = { path = "crates/qs-core" }
qs-capture = { path = "crates/qs-capture" }
qs-ocr = { path = "crates/qs-ocr" }
qs-overlay = { path = "crates/qs-overlay" }
