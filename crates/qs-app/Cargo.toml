[package]
name = "qs-app"
version = "0.4.0"
edition = "2021"

[[bin]]
name = "quickshort"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
image.workspace = true
qs-core.workspace = true
qs-capture.workspace = true
qs-ocr.workspace = true
qs-overlay.workspace = true
arboard = "3"
dirs = "7.0.0"
global-hotkey = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
tray-icon = { version = "0.26.0", default-features = false }
muda = { version = "0.21.0", default-features = false }
winit = "0.30.13"
fontdue = "0.9.4"
rfd = "0.17.2"
serde_json = "1"
softbuffer = "0.4.8"
ureq = { version = "3", features = ["json"] }
getrandom = "0.3"
webp = "0.3.1"

[target.'cfg(target_os = "linux")'.dependencies]
muda = "0.21.0"
tray-icon = "0.26.0"
# tray-icon/muda call gtk; linux runs them on a dedicated gtk::main() thread
gtk = "0.18"
# kde wayland hotkey goes through the GlobalShortcuts portal (zbus);
# async-io/futures-lite drive the portal Response/Activated signals
zbus = { version = "5", features = ["blocking"] }
async-io = "2"
futures-lite = "2"
# chrome backend: self-presented pixels — wl_shm buffers marshalled onto
# winit's own wl_display (wayland-sys is dlopen'd so the binary still
# starts without libwayland), XPutImage on X11 via a private xcb conn
raw-window-handle = "0.6"
libc = "0.2"
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-sys = { version = "0.31", features = ["client", "dlopen"] }
x11rb = { version = "0.13", features = ["shape"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["block2"] }
objc2-foundation = "0.3.2"
objc2-quartz-core = "0.3.2"
block2 = "0.6"
raw-window-handle = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56.0"
raw-window-handle = "0.6"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
