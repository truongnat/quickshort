[package]
name = "qs-app"
version = "0.2.2"
edition = "2021"

[[bin]]
name = "quickshort"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
image.workspace = true
qs-core.workspace = true
qs-capture.workspace = true
qs-ocr.workspace = true
qs-overlay.workspace = true
arboard = "3"
dirs = "7.0.0"
global-hotkey = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
tray-icon = { version = "0.26.0", default-features = false }
muda = { version = "0.21.0", default-features = false }
winit = "0.30.13"
fontdue = "0.9.4"
rfd = "0.17.2"
serde_json = "1"
softbuffer = "0.4.8"
ureq = { version = "3", features = ["json"] }
getrandom = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
muda = "0.21.0"
tray-icon = "0.26.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56.0"
