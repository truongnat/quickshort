[package]
name = "qs-capture"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow.workspace = true
image.workspace = true
qs-core.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["randr"] }
zbus = { version = "5", features = ["blocking"] }
serde = "1"
pipewire = { version = "0.8", features = ["v0_3_34"] }
async-io = "2"
futures-lite = "2"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "11", features = ["macos_14_0"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
