<!doctype html>
<!--
  Quickshort demo video v2 — 3D scene, pure CSS keyframes (~19s @ 1600x900).
  Stage: perspective 1400px; .cam is the animated camera group.
  The screen is a 1200x675 plane; the selection extrudes out of it via
  translateZ; annotations stack as Z-layers; the capture flips into a card.
  Recorded headless via demo/record.mjs -> docs/assets/demo.mp4.
-->
<html>
<head>
<meta charset="utf-8">
<style>
:root {
  --bg: #000;
  --ink: #ededed;
  --muted: #a1a1a1;
  --line: #262626;
  --accent: #52c7ea;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --sans: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
  --snap: cubic-bezier(.2, 1.2, .3, 1);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1600px; height: 900px; overflow: hidden; background: var(--bg); }
body { font-family: var(--sans); }

/* ================= 3D stage ================= */
.stage {
  position: absolute; inset: 0;
  perspective: 1400px;
  opacity: 0;
  animation: stageIn 1s ease 2.1s both, fadeOut .8s ease 15.6s both;
}
@keyframes stageIn { to { opacity: 1; } }
@keyframes fadeOut { to { opacity: 0; } }

/* camera: one long orbit choreography */
.cam {
  position: absolute; left: 50%; top: 50%;
  width: 1200px; height: 675px;
  margin: -337.5px 0 0 -600px;
  transform-style: preserve-3d;
  animation: camOrbit 13.6s linear 2.1s both;
}
@keyframes camOrbit {
  /* 2.1s: reveal tilted */                 0%   { transform: rotateX(22deg) rotateY(-16deg) rotateZ(2deg) translateZ(0); }
  /* 3.0s: settle while hotkey shows */     7%   { transform: rotateX(16deg) rotateY(-11deg) rotateZ(1deg); }
  /* 4.4-6.2 selection drag — drift in */   32%  { transform: rotateX(12deg) rotateY(-8deg) rotateZ(0deg) translateZ(70px); }
  /* 6.2-10.4 annotations — swing wide to show Z-depth */ 55% { transform: rotateX(26deg) rotateY(-26deg) rotateZ(-3deg) translateZ(120px); }
  /* 10.4-11.6 collapse -> front */         66%  { transform: rotateX(6deg) rotateY(-4deg) rotateZ(0deg) translateZ(40px); }
  /* toasts frontal */                      80%  { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg) translateZ(0); }
  /* pull back for card fan-out */          100% { transform: rotateX(14deg) rotateY(10deg) rotateZ(0deg) translateZ(-60px); }
}

/* ================= screen plane ================= */
.screen {
  position: absolute; inset: 0;
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  background: #050505;
  box-shadow: 0 60px 140px rgba(0,0,0,.7);
}
.screen .bg {
  position: absolute; inset: 0;
  background: url("../docs/assets/feat-overlay.png") center/cover;
  filter: brightness(.5);
}
.screen .grid { /* faint hairline grid on the plane */
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.04) 0 1px, transparent 1px 96px),
    repeating-linear-gradient(0deg, rgba(255,255,255,.04) 0 1px, transparent 1px 96px);
}

/* crosshair inside the plane -> inherits perspective for free */
.crosshair {
  position: absolute; left: 24%; top: 18%; width: 0; height: 0;
  opacity: 0;
  animation: chOn .01s 4.2s both, chDrag 1.6s cubic-bezier(.3,1,.4,1) 4.4s both, chOff .3s ease 6.2s both;
}
@keyframes chOn { to { opacity: 1; } }
@keyframes chOff { to { opacity: 0; } }
@keyframes chDrag {
  0%   { left: 24%; top: 18%; }
  100% { left: 76%; top: 76%; }
}
.crosshair i { position: absolute; background: rgba(237,237,237,.35); display: block; }
.crosshair .h { left: -1600px; width: 3200px; height: 1px; }
.crosshair .v { top: -900px; height: 1800px; width: 1px; }
.crosshair b { position: absolute; left: -4px; top: -4px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

/* selection outline drawn on the plane during the drag */
.sel-draw {
  position: absolute; left: 24%; top: 18%;
  width: 0; height: 0;
  border: 2px solid var(--accent); border-radius: 3px;
  opacity: 0;
  animation: selOn .01s 4.4s both, selDraw 1.6s cubic-bezier(.3,1,.4,1) 4.4s both;
}
@keyframes selOn { to { opacity: 1; } }
@keyframes selDraw {
  0%   { width: 0;   height: 0; }
  40%  { width: 26%; height: 26%; }
  100% { width: 52%; height: 58%; }
}

/* the capture card: bright crop that extrudes out of the plane */
.card3d {
  position: absolute; left: 24%; top: 18%; width: 52%; height: 58%;
  border: 2px solid var(--accent); border-radius: 3px;
  overflow: hidden;
  transform: translateZ(0);
  transform-style: preserve-3d;
  opacity: 0;
  animation:
    cardOn .01s 6.2s both,
    cardPop 1s var(--snap) 6.2s both,
    cardSettle .8s cubic-bezier(.3,1,.3,1) 10.4s both,
    cardFan 1.4s cubic-bezier(.4,0,.6,1) 14.6s both;
}
@keyframes cardOn { to { opacity: 1; } }
@keyframes cardPop { to { transform: translateZ(110px); } }
@keyframes cardSettle { to { transform: translateZ(30px); } }
@keyframes cardFan {
  0%   { transform: translateZ(30px); }
  100% { transform: translateZ(-140px) translateX(-560px) translateY(60px) rotateY(24deg) scale(.62); }
}
.card3d .crop {
  position: absolute; left: -46.15%; top: -31.03%;  /* sel rect offset back */
  width: 192.3%; height: 172.4%;                    /* = 1/0.52, 1/0.58 */
  background: url("../docs/assets/feat-overlay.png") center/cover;
}
/* crop box = screen size, counter-offset -> cover aligns pixel-perfect */

/* ghost "recents" cards behind the flying card */
.ghost {
  position: absolute; left: 24%; top: 18%; width: 52%; height: 58%;
  border: 1px solid var(--line); border-radius: 6px;
  background: rgba(10,10,10,.6);
  opacity: 0;
}
.ghost.g1 { animation: ghostIn .9s ease 15.0s both, fan1 1.4s cubic-bezier(.4,0,.6,1) 14.9s both; }
.ghost.g2 { animation: ghostIn .9s ease 15.1s both, fan2 1.4s cubic-bezier(.4,0,.6,1) 15.0s both; }
@keyframes ghostIn { to { opacity: 1; } }
@keyframes fan1 { to { transform: translateZ(-260px) translateX(-300px) translateY(30px) rotateY(20deg) scale(.55); } }
@keyframes fan2 { to { transform: translateZ(-60px) translateX(-430px) translateY(45px) rotateY(22deg) scale(.58); } }

/* ================= annotation layers: each its own Z plane ================= */
.layer {
  position: absolute; left: 24%; top: 18%; width: 52%; height: 58%;
  opacity: 0;
}
.layer.arrow { animation: layOn .01s 7.4s both, layZ1 .7s var(--snap) 7.4s both, layFlat .6s ease 10.4s both; }
.layer.rect  { animation: layOn .01s 8.5s both, layZ2 .7s var(--snap) 8.5s both, layFlat .6s ease 10.4s both; }
.layer.text  { animation: layOn .01s 9.4s both, layZ3 .7s var(--snap) 9.4s both, layFlat .6s ease 10.4s both; }
@keyframes layOn { to { opacity: 1; } }
@keyframes layZ1 { from { transform: translateZ(110px); } to { transform: translateZ(150px); } }
@keyframes layZ2 { from { transform: translateZ(110px); } to { transform: translateZ(190px); } }
@keyframes layZ3 { from { transform: translateZ(110px); } to { transform: translateZ(230px); } }
@keyframes layFlat { to { transform: translateZ(110px); } }

.layer.arrow svg { position: absolute; left: 6%; top: 8%; width: 46%; height: 46%; overflow: visible; }
.layer.arrow path {
  stroke: #ff5f57; stroke-width: 7; fill: none; stroke-linecap: round;
  stroke-dasharray: 600; stroke-dashoffset: 600;
  animation: draw .7s ease-out 7.6s both;
}
@keyframes draw { to { stroke-dashoffset: 0; } }
.layer.rect .r {
  position: absolute; left: 14%; top: 48%; width: 46%; height: 34%;
  border: 6px solid var(--accent); border-radius: 6px;
  clip-path: inset(0 100% 0 0);
  animation: wipe .6s ease-out 8.7s both;
}
@keyframes wipe { to { clip-path: inset(0 0 0 0); } }
.layer.text .t {
  position: absolute; left: 14%; top: 40%;
  font-family: var(--mono); font-size: 40px; font-weight: 700; color: #ffd60a;
  text-shadow: 0 2px 12px rgba(0,0,0,.7);
}
.layer.text .w {
  display: inline-block; overflow: hidden; white-space: nowrap; width: 0;
  vertical-align: bottom;
  animation: type .9s steps(7) 9.6s both;
}
@keyframes type { to { width: 7.6ch; } }
.layer.text .t::after {
  content: ""; display: inline-block; width: 3px; height: 38px;
  background: #ffd60a; vertical-align: bottom; margin-left: 2px;
  animation: caret .8s steps(1) infinite;
}
@keyframes caret { 50% { opacity: 0; } }

/* toolbar floats in front of the plane */
.toolbar {
  position: absolute; left: 50%; top: 84%;
  transform: translateX(-50%) translateZ(160px);
  display: flex; gap: 9px; align-items: center;
  background: rgba(14,14,14,.95);
  border: 1px solid var(--line); border-radius: 14px;
  padding: 9px 13px;
  opacity: 0;
  animation: barIn .5s var(--snap) 6.8s both;
}
@keyframes barIn { to { opacity: 1; } }
.tb {
  width: 36px; height: 36px; border-radius: 9px;
  display: grid; place-items: center; color: var(--ink);
}
.tb.on { background: rgba(82,199,234,.16); color: var(--accent); box-shadow: inset 0 0 0 1px rgba(82,199,234,.4); }
.tb svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tb-sep { width: 1px; height: 22px; background: var(--line); }

/* ================= keycaps (flat overlay, front-most) ================= */
.keycaps {
  position: absolute; left: 50%; top: 62%;
  transform: translateX(-50%);
  display: flex; gap: 10px; z-index: 30;
}
.kc {
  font-family: var(--mono); font-size: 22px; color: var(--ink);
  min-width: 56px; height: 56px; padding: 0 16px;
  display: grid; place-items: center;
  background: rgba(20,20,20,.96);
  border: 1px solid #3a3a3a; border-bottom-width: 3px;
  border-radius: 10px;
  opacity: 0; transform: translateY(14px) scale(.9);
}
.keycaps.hk .kc { animation: kcIn .35s var(--snap) both, kcHold .45s ease 3.6s both; }
.keycaps.hk .kc:nth-child(1) { animation-delay: 3.0s, 3.6s; }
.keycaps.hk .kc:nth-child(2) { animation-delay: 3.12s, 3.6s; }
.keycaps.hk .kc:nth-child(3) { animation-delay: 3.24s, 3.6s; }
.keycaps.hk { animation: fadeOut .3s ease 4.0s both; }
@keyframes kcIn { to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes kcHold { to { transform: translateY(2px) scale(.96); border-bottom-width: 1px; } }
.keycaps.sv .kc { animation: kcIn .3s ease 10.9s both, kcHold .45s ease 11.2s both, fadeOut .3s ease 11.8s both; }
.keycaps.lk .kc { animation: kcIn .3s ease 12.5s both, kcHold .45s ease 12.8s both, fadeOut .3s ease 13.4s both; }

/* ================= toasts (flat overlay) ================= */
.toast {
  position: absolute; left: 50%; top: 72%;
  transform: translateX(-50%) translateY(24px);
  display: flex; align-items: center; gap: 10px;
  font-size: 16px; color: var(--ink);
  background: rgba(14,14,14,.95);
  border: 1px solid var(--line); border-radius: 12px;
  padding: 14px 22px; z-index: 31; white-space: nowrap;
  opacity: 0;
}
.toast .tick { color: #30d158; }
.toast .url { color: var(--accent); font-family: var(--mono); font-size: 14px; }
.toast.t1 { animation: toastIn .45s var(--snap) 11.3s both, toastOut .35s ease 12.9s both; }
.toast.t2 { animation: toastIn .45s var(--snap) 12.95s both, toastOut .4s ease 14.5s both; }
@keyframes toastIn { to { opacity: 1; transform: translateX(-50%) translateY(0); } }
@keyframes toastOut { to { opacity: 0; transform: translateX(-50%) translateY(10px); } }

/* ================= cards (intro / end) ================= */
.cardui {
  position: absolute; inset: 0; z-index: 40;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--bg); text-align: center;
}
.cardui img.icon { width: 96px; height: 96px; border-radius: 24px; }
.cardui h1 { font-size: 66px; font-weight: 700; letter-spacing: -.035em; margin-top: 26px; }
.cardui .tag { font-family: var(--mono); font-size: 15px; color: var(--muted); margin-top: 14px; letter-spacing: .06em; }
.cardui.intro { animation: cardIn .7s ease both, fadeOut .6s ease 2.0s both; }
.cardui.end { opacity: 0; animation: cardIn .9s ease 15.8s both; }
@keyframes cardIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
.cardui .repo {
  margin-top: 30px; font-family: var(--mono); font-size: 16px; color: var(--accent);
  border: 1px solid var(--line); border-radius: 10px; padding: 12px 22px; background: #0a0a0a;
}
.chips { display: flex; gap: 8px; margin-top: 22px; }
.chips span {
  font-family: var(--mono); font-size: 11px; letter-spacing: .18em; color: var(--muted);
  border: 1px solid var(--line); padding: 6px 12px; border-radius: 999px;
}
</style>
</head>
<body>

<!-- 3D scene -->
<div class="stage">
  <div class="cam">
    <div class="screen">
      <div class="bg"></div>
      <div class="grid"></div>
      <div class="crosshair"><i class="h"></i><i class="v"></i><b></b></div>
      <div class="sel-draw"></div>
    </div>

    <div class="ghost g1"></div>
    <div class="ghost g2"></div>

    <div class="card3d"><div class="crop"></div></div>

    <div class="layer arrow">
      <svg viewBox="0 0 300 190"><path d="M 290 20 C 200 60 120 110 40 160 M 40 160 L 95 140 M 40 160 L 62 105"/></svg>
    </div>
    <div class="layer rect"><div class="r"></div></div>
    <div class="layer text"><div class="t"><span class="w">ship it</span></div></div>

    <div class="toolbar">
      <div class="tb"><svg viewBox="0 0 24 24"><path d="M4 20 L8 16 L16 8 L20 4"/><path d="M14 6 L18 10"/></svg></div>
      <div class="tb on"><svg viewBox="0 0 24 24"><path d="M5 19 L19 5"/><path d="M19 5 L13 5 M19 5 L19 11"/></svg></div>
      <div class="tb"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2"/></svg></div>
      <div class="tb"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg></div>
      <div class="tb"><svg viewBox="0 0 24 24"><path d="M4 18 L12 6 L20 18"/></svg></div>
      <div class="tb"><svg viewBox="0 0 24 24"><text x="5" y="18" font-size="15" fill="currentColor" stroke="none" font-family="ui-monospace">T</text></svg></div>
      <div class="tb-sep"></div>
      <div class="tb"><svg viewBox="0 0 24 24"><path d="M4 10 a8 8 0 0 1 14 -4 M18 2 L18 6 L14 6"/></svg></div>
      <div class="tb"><svg viewBox="0 0 24 24"><path d="M20 14 a8 8 0 0 1 -14 4 M6 22 L6 18 L10 18"/></svg></div>
      <div class="tb-sep"></div>
      <div class="tb"><svg viewBox="0 0 24 24"><path d="M12 4 L12 16 M7 11 L12 16 L17 11"/><path d="M5 20 L19 20"/></svg></div>
      <div class="tb"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="13" height="13" rx="2"/><path d="M6 15 L3 15 L3 3 L15 3 L15 6"/></svg></div>
    </div>
  </div>
</div>

<!-- flat overlays -->
<div class="keycaps hk"><div class="kc">⌘</div><div class="kc">⇧</div><div class="kc">S</div></div>
<div class="keycaps sv"><div class="kc">⌘</div><div class="kc">S</div></div>
<div class="keycaps lk"><div class="kc">⌘</div><div class="kc">L</div></div>
<div class="toast t1"><span class="tick">✓</span> Saved <span style="font-family:var(--mono);font-size:14px">quickshort-1791.png</span> · copied to clipboard</div>
<div class="toast t2"><span class="tick">✓</span> Link copied — <span class="url">https://quickshort.tunnl.gg/s/9f2ac1</span></div>

<!-- intro / end cards -->
<div class="cardui intro">
  <img class="icon" src="../docs/assets/icon.png" alt="">
  <h1>Quickshort</h1>
  <p class="tag">Select. Snip. Ship.</p>
</div>
<div class="cardui end">
  <img class="icon" src="../docs/assets/icon.png" alt="">
  <h1>Select. Snip. Ship.</h1>
  <div class="chips"><span>NATIVE</span><span>PURE RUST</span><span>NO ELECTRON</span></div>
  <div class="repo">github.com/truongnat/quickshort</div>
</div>

</body>
</html>
