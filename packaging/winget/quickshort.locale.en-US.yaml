ShortDescription: Region screenshots with annotations and OCR - native Rust, no Electron.
Description: |-
  Press the global hotkey, drag a region - even across monitors - then save a
  pixel-perfect PNG, copy it, pull its text out with the OS-native OCR engine,
  or share it via an expiring link. Draw annotations, record the screen to
  MP4, scroll-capture long pages, pin and beautify captures. Runs as a tray
  app; no runtime, no model downloads.
Moniker: quickshort
